directions:
- name: null
  steps:
  - Combine the sugar, ginger, nutmeg, cinnamon, salt, and baking soda. Mix well.
  - Add the melted margarine, evaporated milk, and molasses. Add the extracts if desired.
    Mix well.
  - >-
    Add the flour 1 cup at a time, stirring constantly. The dough should be stiff enough
    to handle without sticking to fingers.
  - >-
    Knead the dough for a smooth texture. Add up to 1/2 cup additional flour if necessary
    to prevent sticking.
  - When the dough is smooth, roll it out 1/4 inch thick on a floured surface and cut it
    into cookies.
  - >-
    Bake on a greased and floured cookie sheet in a preheated 375°F oven for 10 to 12 minutes.
    Cookies are done if they spring back when touched.
notes:
- I'm trying vegetable oil in place of the melted margarine.
- The flour is more like 5 cups.
