  - {quantity: "1", unit: tsp, item: cinnamon}
  - {quantity: "1/2", unit: tsp, item: salt}
  - {quantity: "1 1/2", unit: tsp, item: baking soda}
  - {quantity: "1", unit: cup, item: margarine, preparation: melted}
  - {quantity: "1/2", unit: cup, item: evaporated milk}
  - {quantity: "1", unit: cup, item: unsulfured molasses}
  - {quantity: "1/4", unit: tsp, item: vanilla extract, optional: true}
  - {quantity: "3/4", unit: tsp, item: lemon extract, optional: true}
