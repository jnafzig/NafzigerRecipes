directions:
- name: null
  steps:
  - Cook the spaghetti until tender.
  - >-
    Mix the butter, parmesan cheese, and beaten eggs and add to the spaghetti. Spread in
    a greased 8x12 baking dish.
  - Sauté and drain the hamburger, onion, and green pepper.
  - Add the salt, sugar, garlic powder, oregano, and whole tomatoes to the hamburger.
  - >-
    Spread the cottage or ricotta cheese over the spaghetti. Add the hamburger mixture and
    pepperoni slices.
  - Bake at 350°F for 30-35 minutes.
