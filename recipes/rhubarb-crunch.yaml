  ingredients:
  - {quantity: "1", unit: cup, item: flour, preparation: sifted}
  - {quantity: "3/4", unit: cup, item: uncooked oatmeal}
  - {quantity: "1", unit: cup, item: brown sugar, preparation: packed}
  - {quantity: "1/2", unit: cup, item: butter, preparation: melted}
  - {quantity: "1", unit: tsp, item: cinnamon}
- name: Filling
  ingredients:
  - {quantity: "4", unit: cup, item: rhubarb, preparation: diced}
- name: Sauce
  ingredients:
