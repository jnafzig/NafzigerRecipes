directions:
- name: null
  steps:
  - Mix the flour, oatmeal, brown sugar, melted butter, and cinnamon until crumbly.
  - Press half of crumbs into a greased 9-inch baking pan.
  - Add diced rhubarb.
  - Combine the sugar, cornstarch, water, and vanilla and cook until thick and clear.
  - Pour over rhubarb.
  - Top with remaining crumbs. Bake at 350°F for 34 to 40 minutes.
  - Cut in squares and serve while warm. Delicious served plain or with cream.
