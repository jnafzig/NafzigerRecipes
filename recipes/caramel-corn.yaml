ingredient_groups:
- name: null
  ingredients:
  - {quantity: "6", unit: qt, item: popped corn}
  - {quantity: "1", unit: cup, item: white sugar}
  - {quantity: null, unit: null, item: Pam or oil spray}
  - {quantity: "1", unit: Tbsp, item: molasses}
  - {quantity: "1/2", unit: stick, item: margarine}
  - {quantity: "1/4", unit: tsp, item: salt}
  - {quantity: "1/4", unit: cup, item: white Karo syrup (light corn syrup)}
  - {quantity: "1/4", unit: tsp, item: baking soda}
directions:
- name: null
  steps:
  - Spray the bottom 2/3 of a brown paper grocery bag with Pam or oil spray. Put the popcorn
    in the bag.
  - >-
    Cook the margarine, Karo, sugar, molasses, and salt, stirring until the mixture boils
    and the sugar is dissolved.
  - >-
    Remove from heat. Add the soda and stir. The mixture will become foamy and double or
    triple in volume.
  - Pour over the popcorn in the bag. Close the bag and shake for 1 to 2 minutes.
  - Put the bag in the microwave on high for 60 seconds. Shake the bag again.
  - Repeat the microwave step and shake.
  - Pour out to cool. Enjoy!
