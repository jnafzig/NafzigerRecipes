id: cranberry-curd-tart
title: Cranberry Curd Tart
category: desserts
author: null
source: Sally McKenney, Sally's Baking Addiction
source_url: https://sallysbakingaddiction.com/cranberry-curd-tart/
date: '2025-11-10'
yield: one 9 inch tart
servings: null
oven_temp_f: 350
prep_time: 20 min
cook_time: 25 min
inactive_time: 6 hr-overnight
pan: 9 inch tart pan with a removable bottom
tags: [cranberry, tart, thanksgiving, make-ahead, vegetarian]
ingredient_groups:
- name: Graham Cracker Crust
  ingredients:
  - {quantity: "1 1/4", unit: cup, item: graham cracker crumbs, note: 150 g; about 10 full sheets}
  - {quantity: "3", unit: Tbsp, item: granulated sugar, note: 37 g}
  - {quantity: "4", unit: Tbsp, item: unsalted butter, preparation: melted, note: 56 g}
- name: Cranberry Curd Filling
  ingredients:
  - {quantity: "1", unit: lb, item: fresh or frozen cranberries, note: 454 g; don't thaw frozen}
  - {quantity: "1", unit: cup, item: orange juice, note: 240 ml}
  - {quantity: "1", unit: cup, item: granulated sugar, note: 200 g}
  - {quantity: "1", unit: null, item: large egg, preparation: room temperature}
  - {quantity: "2", unit: null, item: large egg yolks, preparation: room temperature}
  - {quantity: "2", unit: Tbsp, item: cornstarch}
  - {quantity: "1/4", unit: tsp, item: salt}
  - {quantity: "3", unit: Tbsp, item: unsalted butter, preparation: softened, note: 43 g}
  - {quantity: "1", unit: tsp, item: pure vanilla extract, note: or vanilla bean paste}
- name: Whipped Cream
  ingredients:
  - {quantity: "1", unit: cup, item: heavy cream, preparation: cold, note: 240 ml}
  - {quantity: "2", unit: Tbsp, item: granulated or confectioners' sugar}
  - {quantity: "1/2", unit: tsp, item: pure vanilla extract, note: or vanilla bean paste}
  - {quantity: null, unit: null, item: sugared cranberries, note: for garnish, optional: true}
directions:
- name: Crust
  steps:
  - >-
    Preheat the oven to 350°F. Lightly grease a 9-inch tart pan with a removable bottom with
    nonstick spray.
  - >-
    If starting with whole graham crackers, grind them to fine crumbs in a food processor or
    blender. Stir the crumbs and sugar together in a medium bowl, then stir in the melted
    butter; it will be thick, coarse, and sandy. Break up any large chunks.
  - >-
    Pour into the tart pan and pat the crumbs into the bottom and up the sides with medium
    pressure until compact and no longer crumbly. Don't pack it hard or the crust will be too
    hard.
  - Bake 10 minutes. Set aside on a cooling rack.
- name: Cranberry Curd
  steps:
  - >-
    In a medium saucepan over medium heat, combine the cranberries, orange juice, and sugar.
    Bring to a boil and cook, stirring and mashing the berries against the side of the pan,
    until they have all burst, about 10 minutes. Remove from the heat and cool at least 20
    minutes.
  - >-
    Puree in a high-powered blender or food processor until completely smooth, with no
    specks of skin left. Pour back into the saucepan.
  - >-
    In a small bowl, whisk the egg, egg yolks, cornstarch, and salt until smooth. Whisk into
    the cranberry puree.
  - >-
    Bring the curd to a boil over medium heat, stirring constantly. Reduce the heat to
    medium-low and simmer, scraping the bottom and sides with a silicone spatula, until
    thickened, 5-7 minutes (about 200°F on an instant-read thermometer).
  - >-
    Off the heat, whisk in the butter and vanilla until melted and smooth. Pour into the
    crust and smooth the top with an offset spatula. Cool at room temperature 30-45 minutes,
    then refrigerate at least 6 hours or overnight.
- name: Whipped Cream and Serving
  steps:
  - >-
    Whip the cream, sugar, and vanilla on medium-high speed to medium peaks, about 3
    minutes. If it over-whips and looks curdled, gently fold in a little more cold cream by
    hand.
  - >-
    Spread the whipped cream over the tart and garnish with sugared cranberries, if using.
    Remove the rim of the pan, slice, and serve.
notes:
- >-
  Make ahead: the baked crust keeps, covered, at room temperature up to 2 days. The assembled
  tart (without whipped cream) keeps, covered, in the refrigerator up to 2 days. Add the
  whipped cream shortly before serving. Making the curd itself ahead isn't recommended; it
  sets too thick to spread.
- >-
  To freeze: once the curd has set, wrap the tart in its pan in two layers of plastic wrap
  and one of foil, and freeze up to 3 months. Thaw overnight in the refrigerator, then add
  the whipped cream.
- Leftovers keep, covered, in the refrigerator up to 3 days.
