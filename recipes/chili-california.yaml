directions:
- name: null
  steps:
  - >-
    In a Dutch oven, sauté the onion, celery, jicama, carrots, green pepper, and garlic
    in oil until crisp-tender.
  - Add the bouillon cubes, cumin, chili powder, tomato sauce, tomatoes, and water. Bring
    to a boil.
  - Cover and simmer for 20 minutes, stirring occasionally.
  - Uncover and simmer to desired thickness and until vegetables are tender, 10-20 minutes.
  - Stir in the beans and heat through.
  - Sprinkle cheese over the top and serve immediately.
notes:
- This is a low-calorie chili, which has lost none of its good full flavor.
- I pre-cooked a variety of dry beans.
- I never used jicama.
- This is a recipe that is easy to experiment with.
