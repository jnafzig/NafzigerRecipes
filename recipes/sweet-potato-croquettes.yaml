directions:
- name: null
  steps:
  - Cook the sweet potatoes until soft, then mash very fine.
  - Season the mashed sweet potatoes with the salt, sugar, and melted butter.
  - Shape the potato mixture around a marshmallow.
  - Chill in the refrigerator 30 minutes.
  - Dip the balls into the slightly beaten egg white and roll in the corn flake or bread
    crumbs.
  - Place in a flat greased baking dish and bake at 400°F for 20 minutes or until golden
    brown.
notes:
- I skip the egg and just roll the croquette in crumbs.
- You can skip the marshmallow and just roll the sweet potato croquette in crumbs.
