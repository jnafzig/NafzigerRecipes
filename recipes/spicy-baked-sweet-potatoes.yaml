directions:
- name: null
  steps:
  - Preheat the oven to 375°F. Line a baking sheet with foil and coat lightly with olive
    oil.
  - >-
    Spread the potato wedges on the baking sheet with enough room so that they don't touch
    (touching will make them steam each other).
  - >-
    Drizzle with olive oil or spray with olive oil cooking spray, then dust generously with
    chili powder, salt, and pepper.
  - >-
    Cook for 30-35 minutes until they are almost soft enough to eat, then turn the oven
    up to 425°F for 10 more minutes to get them brown and crisp.
  - Eat plain or dip into ketchup!
notes:
- >-
  The cooking time will vary somewhat depending on how thick your slices are, so start checking
  the potatoes after 30 minutes.
