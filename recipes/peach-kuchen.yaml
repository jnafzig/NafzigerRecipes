directions:
- name: null
  steps:
  - Preheat oven to 400°F.
  - Combine flour, baking powder, salt, and 2 Tbsp sugar in a bowl. Cut in margarine or
    butter.
  - Pat mixture over bottom and sides of a 9-inch pie pan or skillet.
  - Arrange peach halves in pastry.
  - Combine 1/4 cup sugar with cinnamon and sprinkle over peaches.
  - Bake for 15 minutes.
  - Combine beaten egg and sour cream. Pour over peaches and bake 30 minutes longer.
notes:
- Drizzle peaches with honey instead of sugar.
- Use 2 cups fresh diced rhubarb in place of the peaches; increase sugar over fruit to 1/2
  cup.
