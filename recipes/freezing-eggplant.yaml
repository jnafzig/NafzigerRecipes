  steps:
  - >-
    Wash, peel, and slice 1/3 inch thick. Prepare quickly; just enough eggplant for 1 scalding
    at a time.
  - >-
    Scald 4 minutes in 1 gallon boiling water containing 4 1/2 teaspoons citric acid or
    1/2 cup lemon juice.
  - Cool, drain, and pack in cans, freezer jars, or plastic freezer boxes.
  - 'For frying: pack the drained slices with freezer wrap between slices. Seal, label,
    and freeze.'
