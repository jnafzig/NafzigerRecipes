directions:
- name: null
  steps:
  - Melt the margarine in an 8 or 9 inch square or round pan.
  - Make a batter of the flour, sugar, baking powder, milk, and salt.
  - Pour over melted butter, but do not stir.
  - >-
    Mix the fruit with 1/2 cup sugar (no sugar if fruit is already sweetened) and pour over
    top of batter.
  - Sprinkle with desired spice (cinnamon or nutmeg).
  - Bake for one hour at 350°F (325°F if using a glass pan).
  - Serve warm with sugar and milk.
notes:
- If using a glass pan, reduce heat to 325°F.
- Works with peaches, cherries, blueberries, rhubarb, or apples.
