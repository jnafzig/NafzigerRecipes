directions:
- name: null
  steps:
  - >-
    Start with fresh tomatoes. Wash and core them, then cook them until soft and run them
    through the Squeezo.
  - Pour the hot tomato juice into the copper bottom pan.
  - Add the remaining ingredients.
  - Measure the depth.
  - Boil until it is half the original depth.
notes:
- We halved the sugar from the original recipe and used brown instead of white sugar.
- We used apple cider vinegar instead of white distilled vinegar.
- >-
  We modified the recipe to the amount of tomato juice we had, which was slightly more than
  the 56 oz canned tomatoes the original calls for.
