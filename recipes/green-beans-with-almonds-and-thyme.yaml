ingredient_groups:
- name: null
  ingredients:
  - {quantity: "2", unit: lb, item: green beans, preparation: trimmed, note: fresh or frozen}
  - {quantity: "1/4", unit: cup, item: butter, note: 1/2 stick}
  - {quantity: "1", unit: Tbsp, item: Dijon mustard}
  - {quantity: "1", unit: tsp, item: garlic salt}
  - {quantity: "2", unit: Tbsp, item: fresh thyme, preparation: chopped}
  - {quantity: "1/3", unit: cup, item: slivered almonds, preparation: lightly toasted}
directions:
- name: null
  steps:
  - >-
    Cook the green beans in a large pot of boiling salted water until just crisp-tender,
    about 5 minutes.
  - >-
    Drain the beans and transfer them to a large bowl of ice water, cooling them completely.
    (The ice water will shock the beans into a vibrant green color.) Drain the beans well.
  - >-
    Melt the butter in a large, heavy skillet over medium-high heat. Whisk half of the thyme
    (1 Tbsp), the Dijon mustard, and the garlic salt into the butter.
  - Add the beans to the skillet and toss until heated through, about 4 minutes.
  - Transfer to a serving bowl. Sprinkle with the toasted almonds and the remaining 1 Tbsp
    of thyme.
notes:
- After chilling and draining, the beans can be made a day ahead and stored in the refrigerator.
- Alternatively, steam the beans for 5 minutes and proceed directly to the skillet.
