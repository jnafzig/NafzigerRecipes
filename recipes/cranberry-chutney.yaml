  - {quantity: "1/2", unit: cup, item: golden raisins}
  - {quantity: "2", unit: tsp, item: ground cinnamon}
  - {quantity: "1 1/2", unit: tsp, item: ground ginger}
  - {quantity: "1 1/2", unit: tsp, item: ground cloves}
