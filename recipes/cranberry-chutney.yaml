directions:
- name: null
  steps:
  - >-
    Combine the cranberries, sugar, brown sugar, raisins, cinnamon, ginger, cloves, allspice,
    and water in a Dutch oven.
  - >-
    Cook over medium heat, stirring frequently, until juice is released from cranberries,
    about 15 minutes.
  - >-
    Stir in the apple, onion, and celery. Reduce heat and simmer, uncovered, about 15 minutes
    or until thickened, stirring occasionally.
  - Chill before serving.
notes:
- Chutney will keep in the refrigerator in an airtight container for up to 2 weeks.
