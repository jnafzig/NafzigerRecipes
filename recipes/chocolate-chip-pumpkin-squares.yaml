directions:
- name: null
  steps:
  - Preheat oven to 325°F. Grease pan.
  - Sift together the flour, baking powder, baking soda, cinnamon, and nutmeg.
  - Beat the eggs. Add the sugar, brown sugar, shortening, and pumpkin and beat together.
  - Add flour mixture to sugar mixture. Blend.
  - Add chocolate chips (or sprinkle chips on top of batter after it is in the pan).
  - Pour mixture into pan. Bake for 45 minutes.
  - Allow to cool for 45 minutes, then cut into squares.
