story: >-
  When I was growing up, this recipe from Grandma Hess was standard fare for Saturday evening
  supper. If it was not on the table Grandpa wondered where his corn pone was. My family
  enjoyed this with chili and other soups and corn pone was often served to guests who joined
  us for Sunday noon lunch.
