ingredient_groups:
- name: null
  ingredients:
  - {quantity: "24", unit: oz, item: cottage cheese}
  - {quantity: "1", unit: tsp, item: Italian seasoning}
  - {quantity: "1", unit: tsp, item: garlic powder, optional: true}
  - {quantity: "1", unit: null, item: egg}
  - {quantity: "1", unit: pkg, item: frozen chopped spinach, note: '10 oz pkg; other summer
      vegetables such as summer squash, cooked carrots, or eggplant can be used'}
  - {quantity: "1", unit: jar, item: spaghetti sauce, note: 32 oz jar}
  - {quantity: "1", unit: pkg, item: lasagna noodles, preparation: uncooked, note: 16 oz
      pkg}
  - {quantity: "1", unit: lb, item: mozzarella cheese, preparation: grated}
  - {quantity: "1/2-3/4", unit: cup, item: water}
directions:
- name: null
  steps:
  - Mix together the cottage cheese, seasoning, egg, and garlic powder.
  - Thaw and thoroughly drain the spinach. Add to the cottage cheese mixture.
  - In the bottom of a 10x14 glass baking dish, spread a thin layer of spaghetti sauce.
  - >-
    Layer with 1/3 of the dry noodles, 1/3 of the cottage cheese mixture, and 1/3 of the
    grated cheese. Pour 1/3 of the remaining spaghetti sauce over all.
  - Repeat the layers 2 more times, ending with grated cheese.
  - Set aside 60-75 minutes before baking.
  - When ready to bake, pour the water around the edges.
  - Bake at 325°F for 1 hour. Let stand in a warm place 10-15 minutes before serving.
notes:
- I use other summer vegetables such as summer squash, cooked carrots, eggplant, etc.
