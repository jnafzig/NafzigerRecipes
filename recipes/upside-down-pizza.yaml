  - {quantity: "1", unit: can, item: pizza sauce, note: can or jar (15 1/2 oz)}
  - {quantity: "1/2", unit: tsp, item: garlic salt}
  - {quantity: "1/4", unit: tsp, item: dried oregano leaves}
  - {quantity: "8", unit: oz, item: mozzarella cheese, preparation: grated}
- name: Topping
  ingredients:
  - {quantity: "2", unit: null, item: eggs}
  - {quantity: "1", unit: cup, item: milk}
  - {quantity: "1", unit: Tbsp, item: oil}
