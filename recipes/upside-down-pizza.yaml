directions:
- name: null
  steps:
  - Preheat the oven to 350°F.
  - Meanwhile, brown the ground beef and onion; pour off the fat.
  - Blend in the pizza sauce, garlic salt, and oregano.
  - Put the mixture in a greased 9x13 pan and sprinkle with the mozzarella cheese.
  - >-
    In a small bowl mix the eggs, milk, oil, salt, and flour. Pour over the meat mixture
    and sprinkle with the Parmesan cheese.
  - Bake 30 minutes.
notes:
- Mushrooms, bell pepper strips, Italian sausage and/or Canadian bacon may be added if desired.
