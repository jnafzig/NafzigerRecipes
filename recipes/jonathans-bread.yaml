directions:
- name: null
  steps:
  - Mix the flour, yeast, and salt.
  - Add the water and mix. Let sit for 12 to 24 hours. The dough should spread out and get
    bubbly.
  - Preheat the oven to 450°F with the covered dish inside.
  - Using plenty of flour, gently form the dough into a ball without squishing it too much.
  - >-
    Place it into the preheated pot and bake for 30 minutes covered, then remove the cover
    and bake for 15 more minutes.
  - Remove and let cool on a rack.
