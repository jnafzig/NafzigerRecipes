directions:
- name: null
  steps:
  - Sift the flour, sugar, baking powder, salt, and baking soda into a large bowl.
  - Cut in the butter until the mixture is crumbly.
  - Add the egg, orange peel, and orange juice all at once; stir just until the mixture
    is evenly moist.
  - Fold in the raisins and cranberries.
  - >-
    Spoon into a greased 9x5x3 inch loaf pan. Bake at 350°F for 1 hour and 10 minutes, or
    until a toothpick inserted in the center comes out clean.
  - Remove from the pan and cool on a wire rack.
notes:
- If you choose, you may substitute cranberries for the raisins to have all cranberry bread.
