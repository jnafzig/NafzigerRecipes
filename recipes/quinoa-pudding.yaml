directions:
- name: null
  steps:
  - Place quinoa in a sieve and rinse thoroughly. Allow to drain.
  - Place quinoa in a medium saucepan with water. Bring to a boil over high heat.
  - >-
    Cover pan with lid, lower heat, and allow to simmer until all water is absorbed and
    quinoa is tender, about 15 minutes.
  - >-
    Mix in apple juice, raisins, lemon juice, cinnamon, and salt. Cover pan and allow to
    simmer for 15 minutes longer.
  - Stir in vanilla extract. Serve warm.
