directions:
- name: Meatloaf
  steps:
  - Beat the eggs in a small bowl. Add the milk and crumbs and stir together with a fork.
    Set aside.
  - >-
    In a medium bowl combine the ground beef, onion, and seasonings. Add the milk and crumb
    mixture and stir well.
  - Pack the meatloaf into a greased loaf or baking pan.
- name: Piquant Sauce
  steps:
  - Combine all sauce ingredients and beat together with a fork.
  - Spread the sauce over the meatloaf. Bake at 350°F for 1 hour.
