  - {quantity: "2", unit: null, item: eggs, preparation: beaten}
  - {quantity: "1 1/2", unit: lb, item: ground beef}
  - {quantity: "1", unit: cup, item: milk}
  - {quantity: "1/4", unit: cup, item: onion, preparation: chopped}
  - {quantity: "2/3", unit: cup, item: bread or cracker crumbs}
