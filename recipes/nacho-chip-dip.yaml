  ingredients:
  - {quantity: "1", unit: lb, item: hamburger}
  - {quantity: "1", unit: pkg, item: taco seasoning, note: or 1/4 cup}
  - {quantity: null, unit: null, item: water, note: as directed on the taco seasoning package}
  - {quantity: "1", unit: can, item: refried beans, note: 16 oz can}
  - {quantity: "1", unit: jar, item: salsa, note: 16 oz jar; the type of salsa sets the
      spiciness}
  - {quantity: "1", unit: lb, item: Velveeta cheese, note: "source lists 'Velveeta cheese\
      \ or 1 cup sour cream'; the oven method uses sour cream plus shredded cheese on top"}
