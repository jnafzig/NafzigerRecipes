directions:
- name: null
  steps:
  - Brown the hamburger. Drain.
  - Add the taco seasoning and water as directed on the taco seasoning package.
- name: Slow Cooker Method
  steps:
  - Combine everything in a slow cooker. Heat on high for 45 minutes.
  - Serve with your choice of tortilla chip.
- name: Oven Method
  steps:
  - Mix the sour cream and beans together in a separate bowl.
  - 'Layer in a 9x11 dish: ground beef, sour cream and beans, and then salsa.'
  - Sprinkle shredded cheese on top.
  - Bake 20-25 minutes at 350°F. Serve with your choice of tortilla chip.
notes:
- >-
  There are two ways to do this recipe. I most often use the slow cooker method, but it
  may also be layered in a casserole dish.
- Adjust the spiciness of the dip by the type of salsa you use.
story: >-
  This recipe is new to our family since our move to Indiana. Two different friends gave
  two similar recipes so I combined them.
