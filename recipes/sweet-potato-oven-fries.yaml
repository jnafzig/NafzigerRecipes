directions:
- name: null
  steps:
  - Heat the oven to 450°F. Spray a baking sheet with nonstick cooking spray.
  - Cut the sweet potatoes into French fries (about 3 inches long and 1/4 inch thick).
  - Place in a large bowl and toss with the oil, paprika, garlic powder, salt, and pepper.
  - Arrange the sweet potatoes in a single layer on the prepared baking sheet.
  - Roast for about 18 minutes, turning once, until lightly browned and tender. Serve immediately.
