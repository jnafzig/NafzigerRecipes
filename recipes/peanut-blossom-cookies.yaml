ingredient_groups:
- name: null
  ingredients:
  - {quantity: "1 3/4", unit: cup, item: flour}
  - {quantity: "1", unit: tsp, item: baking soda}
  - {quantity: "1/2", unit: tsp, item: salt}
  - {quantity: "1/2", unit: cup, item: shortening, note: or canola oil; Abby recommends
      butter}
  - {quantity: "1/2", unit: cup, item: peanut butter}
  - {quantity: "1/2", unit: cup, item: white sugar, note: skimp}
  - {quantity: "1/2", unit: cup, item: brown sugar}
  - {quantity: "1", unit: null, item: egg}
  - {quantity: "2", unit: tsp, item: milk, note: skip if using oil}
  - {quantity: "1", unit: tsp, item: vanilla}
  - {quantity: "9", unit: oz, item: Hershey Kisses, preparation: unwrapped, note: 1 package}
  - {quantity: "1/4", unit: cup, item: sugar, note: 'or as needed, for rolling'}
directions:
- name: null
  steps:
  - Combine flour, baking soda, and salt in a bowl; set aside.
  - >-
    In a large bowl cream together shortening and peanut butter. Gradually add 1/2 cup white
    and 1/2 cup brown sugar and stir until fluffy.
  - Add egg, milk, and vanilla and beat well.
  - Gradually add dry ingredients to creamed mixture, blending thoroughly.
  - >-
    Shape into 1-inch balls and roll in white sugar. Place on ungreased cookie sheet at
    least 1 inch apart.
  - Bake at 375°F for 10-12 minutes. Remove from oven.
  - >-
    Press an unwrapped Hershey Kiss in the center of each cookie. Let cool before placing
    in storage container.
notes:
- I've tried canola oil in place of the shortening; if using oil I skip the milk.
- Abby recommends butter in place of the shortening.
- Skimp on the white sugar.
