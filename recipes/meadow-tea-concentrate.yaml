  - {quantity: "6", unit: cup, item: tea leaves, note: or more}
  - {quantity: "1 1/2", unit: pkg, item: lemon Kool-Aid}
directions:
- name: null
  steps:
  - Mix the water and sugar and bring to a boil.
  - Turn off the heat and add the tea leaves. Let this steep for 45 minutes.
  - Remove the leaves and pour through a sieve.
  - Add the lemonade mix. Cool.
  - To serve, mix about 1 cup of concentrate to 3 cups of water, plus ice.
notes:
- >-
  Some will want to make the final mixture stronger or weaker. Adjust the ratio of tea to
  water to suit your taste. This is clearly a recipe to make your own according to your
  preference.
- My sister Rhoda used 3 small cans of frozen lemon concentrate.
story: From my mother (Mary Hess).
