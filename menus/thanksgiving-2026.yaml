# yaml-language-server: $schema=../menu.schema.json
id: thanksgiving-2026
title: Thanksgiving 2026
date: '2026-11-26'
serve_time: 1:00 pm
serve_at: '406'
kitchens:
- {id: '406', cook: Jonathan}
- {id: '1807', cook: Abby}
