plan:
- date: '2026-11-24'
  tasks:
  - time: evening
    recipe: spice-rubbed-butterflied-smoked-turkey
    task: >-
      Butterfly the turkey and remove the wishbone. Oil it, rub on the spice mix, and refrigerate
      it on a rack over a rimmed baking sheet, loosely covered with plastic wrap, until Thursday.
  - time: evening
    recipe: smoked-turkey-gravy
    task: Refrigerate the backbone, neck, and giblets (not the liver) for the gravy stock.
  - time: evening
    recipe: blackberry-blueberry-crumb-pie
    task: Make the pie dough, wrap it, and refrigerate (it keeps up to 2 days).
- date: '2026-11-25'
  tasks:
  - time: morning
    recipe: cranberry-curd-tart
    task: >-
      Make and bake the crust, make the cranberry curd, and fill the tart. Cool 30-45 minutes,
      then refrigerate overnight. Save the whipped cream for Thursday.
  - time: morning
    recipe: blackberry-blueberry-crumb-pie
    task: >-
      Roll out the crust, freeze the shell 15 minutes, and par-bake 20 minutes at 400°F. Fill,
      top with the crumbs, and bake about 1 hour at 375°F, until bubbling at the edges. Cool,
      then refrigerate overnight.
  - time: midday
    recipe: mama-stambergs-cranberry-relish
    task: Grind the cranberries and onion, mix in everything else, and freeze.
  - time: afternoon
    recipe: classic-green-bean-casserole
    task: >-
      Trim the fresh green beans and simmer them in salted water 7-8 minutes, until
      tender-crisp; drain. Mix the casserole with 1 cup of the fried onions and spread it in the
      baking dish. Cover and refrigerate. Keep the remaining 1/2 cup onions in the bag for
      Thursday.
  - time: afternoon
    recipe: smoked-turkey-gravy
    task: >-
      Make the turkey stock (about 1 1/4 hours, mostly simmering), then the gravy base with 3
      cups of it. Refrigerate the base and the remaining 1 cup of stock separately.
  - time: afternoon
    recipe: creamed-leeks
    task: >-
      Trim, slice, wash, and dry the leeks. Mince the garlic. Refrigerate both so Thursday is
      just cooking.
  - time: afternoon
    recipe: simple-is-best-stuffing
    task: >-
      Dry the bread 1 hour at 250°F, cook the onions and celery, and mix everything with the
      broth and eggs. Bake covered at 350°F until the center reads 160°F, 35-40 minutes.
      Uncover, cool, cover, and refrigerate. Thursday is just the browning.
  - time: afternoon
    recipe: warm-brussels-sprouts-salad
    task: >-
      Shred the sprouts. Cook and chop the bacon, saving 2 tablespoons of the grease. Shave the
      Gruyère, chop the almonds, and shake up the dressing. Refrigerate each separately.
- date: '2026-11-26'
  tasks:
  - time: 7:00 am
    recipe: slow-cooker-mashed-potatoes
    task: >-
      Peel and dice the potatoes into the buttered slow cooker with the garlic, salt, pepper,
      and 1 1/2 cups of the milk. Cover and cook on HIGH (4-5 hours).
  - time: 8:15 am
    recipe: spice-rubbed-butterflied-smoked-turkey
    task: Start the smoker at 275°F.
  - time: 8:15 am
    recipe: mama-stambergs-cranberry-relish
    task: Move the relish from the freezer to the refrigerator to thaw.
  - time: 8:45 am
    recipe: spice-rubbed-butterflied-smoked-turkey
    task: Turkey on the smoker, skin side up, probe in the breast.
  - time: 8:45 am
    recipe: smoked-turkey-gravy
    task: Drip pan under the turkey with about 1 cup of water. Top it up when you check the pellets.
  - time: 9:00 am
    recipe: blackberry-blueberry-crumb-pie
    task: Take the pie out of the refrigerator so it's at room temperature for dessert.
  - time: 10:15 am
    recipe: spice-rubbed-butterflied-smoked-turkey
    task: Check the pellet level and top up the hopper if needed. Check the drip pan's water too.
  - time: 11:00 am
    recipe: simple-is-best-stuffing
    task: Take the stuffing out of the refrigerator. Preheat the oven to 350°F.
  - time: 11:15 am
    recipe: spice-rubbed-butterflied-smoked-turkey
    task: >-
      Start checking temperatures. It's done when the breast reads 150°F and the legs at least
      165°F (2 1/2-3 1/2 hours at 275°F, so 11:15 to 12:15).
  - time: 11:30 am
    recipe: classic-green-bean-casserole
    task: Take the casserole out of the refrigerator. Preheat the oven to 350°F.
  - time: 11:30 am
    recipe: simple-is-best-stuffing
    task: Bake uncovered until the top is golden brown and crisp, 45-60 minutes.
  - time: 11:30 am
    recipe: slow-cooker-mashed-potatoes
    task: >-
      Once the potatoes are falling-apart tender, warm the butter and 2 cups of milk, mash the
      potatoes in the crock, and stir it in. Season and hold on WARM.
  - time: 12:00 pm
    recipe: classic-green-bean-casserole
    task: >-
      Bake uncovered 40-45 minutes (10 more than usual because it was refrigerated), until
      bubbly.
  - time: 12:15 pm
    recipe: creamed-leeks
    task: >-
      Cook the leeks: about 30 minutes from butter to cream. Keep warm on low until dinner.
  - time: 12:15 pm
    recipe: spice-rubbed-butterflied-smoked-turkey
    task: Turkey off the smoker by now at the latest. Rest 15 minutes, then carve.
  - time: 12:30 pm
    recipe: smoked-turkey-gravy
    task: >-
      Pour the drippings into a fat separator and skim. Reheat the gravy base, whisk in the
      drippings a little at a time, tasting (they're salty), and simmer 5 minutes. Thin with
      the reserved stock if needed.
  - time: 12:30 pm
    recipe: simple-is-best-stuffing
    task: Take the stuffing out and cover it with foil to keep it warm.
  - time: 12:30 pm
    recipe: warm-brussels-sprouts-salad
    task: >-
      Heat the bacon grease in the skillet and cook the sprouts about 5 minutes. Stir in the
      dressing and half the cheese, then the bacon and almonds. Slice the apple and add it
      last.
  - time: 12:45 pm
    kitchen: '1807'
    task: >-
      Walk over to 406 with the stuffing, potatoes (in the crock), Brussels sprouts with the
      rest of the cheese, and pie. Plug the slow cooker in on WARM when you get there.
  - time: 12:45 pm
    recipe: classic-green-bean-casserole
    task: Stir, top with the remaining fried onions, and bake 10 minutes more, until golden.
  - time: 1:00 pm
    task: Dinner.
  - time: after dinner
    recipe: cranberry-curd-tart
    task: >-
      Whip the cream (about 3 minutes), spread it over the tart, garnish, remove the pan rim,
      and serve.
