    for: [warm-brussels-sprouts-salad]
  - item: Flat-leaf parsley
    amount: 1 bunch
    for: [simple-is-best-stuffing]
    note: ½ cup chopped
  - item: Fresh sage and rosemary
    amount: 1 small package each
    for: [simple-is-best-stuffing]
    note: 2 Tbsp sage and 1 Tbsp rosemary, chopped. A poultry blend package has both, plus thyme.
  - item: Blueberries
    amount: 2 pints
    for: [blackberry-blueberry-crumb-pie]
